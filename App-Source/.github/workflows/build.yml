name: Build Lunaris Dolby APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v1.0"
        name: "Dolby Atmos Poco F4 (HyperOS 3) Initial Release"
        files: app/build/outputs/apk/debug/app-debug.apk
        body: "- 🚀 **Magisk Module**: Fully working Dolby Atmos hardware fix.\n- 📱 **Dolby App**: Modified standalone control app."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
