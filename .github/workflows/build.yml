name: Build Lunaris Dolby APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./App-Source

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      working-directory: ./App-Source

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk LunarisDolby-v1.0.apk
      working-directory: ./App-Source

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0"
        name: "Dolby Atmos Poco F4 (HyperOS 3) Initial Release"
        files: |
          App-Source/LunarisDolby-v1.0.apk
          Magisk-Module/Dolby-Atmos-PocoF4-HyperOS3.zip
        body: "- 🚀 **Magisk Module**: Fully working Dolby Atmos hardware fix.\n- 📱 **Dolby App**: Modified standalone control app."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
