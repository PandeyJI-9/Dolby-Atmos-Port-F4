name: Build Lunaris Dolby APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./App-Source

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      working-directory: ./App-Source

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk LunarisDolby-v2.0.apk
      working-directory: ./App-Source

    - name: Package Magisk Module
      run: |
        sudo apt-get install -y zip
        cd Magisk-Module
        rm -f Dolby-Atmos-PocoF4-HyperOS3.zip
        zip -r -9 Dolby-Atmos-PocoF4-HyperOS3.zip . -x "*.git*" "Dolby-Atmos-PocoF4-HyperOS3.zip"
        cd ..

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v2.0"
        name: "Lunaris Dolby v2.0 (Ultimate Edition)"
        files: |
          App-Source/LunarisDolby-v2.0.apk
          Magisk-Module/Dolby-Atmos-PocoF4-HyperOS3.zip
        body: |
          # 🚀 Lunaris Dolby v2.0 - Ultimate Edition
          
          ### 🎧 Flagship Audio Upgrades:
          - **Smart Mic & Call Bypass**: Auto-suspends Dolby during cellular calls & WhatsApp/VoIP/BGMI voice chats, completely eliminating robotic distortion and echo.
          - **Hardware Volume Leveler Fix**: Configured DAX 3.3 hardware leveler amount to Level 7 across all profiles in `dax-default.xml`.
          - **HyperOS Native QS Tile Sync**: Bidirectional real-time sync with HyperOS Control Center Dolby tile (`dolby_open` & `v2_sound_effect`).
          - **Zero-RAM Isolated Core**: Frontend UI terminates on exit; background engine isolated to lightweight `:dolby_core`.
          - **AutoEQ Integration**: Built-in access to 5000+ headphone & IEM profiles with mathematical frequency interpolation.
          - **Smooth 120Hz Sliders**: Eliminated JNI flooding during slider dragging for zero stutter.
          - **Per-App Profile Automation**: Auto-switches profiles per application.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
