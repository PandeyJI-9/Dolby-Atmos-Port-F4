name: Build Lunaris Dolby APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./App-Source

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      working-directory: ./App-Source

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk LunarisDolby-v2.0.apk
      working-directory: ./App-Source

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v2.0"
        name: "Lunaris Dolby v2.0 (Zero-RAM & Smart Mic Bypass)"
        files: |
          App-Source/LunarisDolby-v2.0.apk
          Magisk-Module/Dolby-Atmos-PocoF4-HyperOS3.zip
        body: "- 🚀 **Zero-RAM Architecture**: App completely isolated for 0 background drain.\n- 🎙️ **Smart Mic Bypass**: No more robotic/bangar sounds on calls or BGMI.\n- 🐛 **UI Fixes**: 120Hz smooth sliders and profile fixes."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
